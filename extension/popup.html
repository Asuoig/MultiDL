<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body{width:260px;margin:0;padding:14px;font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;
    background:#fff;color:#1b1f27}
  h1{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:#dc2626;display:inline-block;margin-right:5px}
  .dot.on{background:#16a34a}
  .row{display:flex;align-items:center;gap:8px;margin:9px 0}
  label{color:#6b7280;font-size:12px}
  input[type=number]{width:70px;padding:5px 7px;border:1px solid #e3e6ec;border-radius:6px}
  button{width:100%;padding:7px;border:1px solid #e3e6ec;background:#fff;border-radius:7px;
    cursor:pointer;font:inherit;margin-top:6px}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  .hint{color:#9aa1ad;font-size:11.5px;margin-top:10px;line-height:1.45}
</style>
</head>
<body>
<h1>MultiDL <span><span class="dot" id="dot"></span><span id="st">检测中</span></span></h1>

<div class="row">
  <label style="flex:1">接管浏览器下载</label>
  <input type="checkbox" id="enabled" checked>
</div>
<div class="row">
  <label>本地端口</label>
  <input type="number" id="port" value="8765">
</div>

<button class="primary" id="dl">下载当前标签页</button>
<button id="ui">打开下载器界面</button>

<div class="hint" id="hint">需要先启动 MultiDL（run.py 或 start.bat）。接管时浏览器原生下载会被取消。</div>

<script>
const $ = s => document.querySelector(s);
const load = async () => {
  const c = await chrome.storage.local.get({ port: 8765, enabled: true, lastError: "" });
  $('#port').value = c.port; $('#enabled').checked = c.enabled;
  // 把最近一次投递失败显示出来，否则线上 403 完全没法定位
  if (c.lastError) $('#hint').textContent = "上次失败：" + c.lastError;
  ping();
};
const ping = () => chrome.runtime.sendMessage({ type: "ping" }, r => {
  const on = r && r.ok;
  $('#dot').className = "dot" + (on ? " on" : "");
  $('#st').textContent = on ? "已连接" : "未连接";
  if (!on) {
    // 最常见的原因就是客户端没开 —— 直接说清楚，别让用户以为扩展坏了
    $('#hint').textContent =
      "客户端未启动：请先打开 MultiDL（桌面上的 MultiDL.exe），否则浏览器会自己下载。";
  }
});
$('#port').onchange = () => {
  chrome.storage.local.set({ port: Number($('#port').value) || 8765 }, ping);
};
$('#enabled').onchange = () => {
  chrome.storage.local.set({ enabled: $('#enabled').checked });
};
$('#ui').onclick = () => chrome.runtime.sendMessage({ type: "openUI" });
$('#dl').onclick = async () => {
  const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
  if (!tab || !tab.url) {
    $('#st').textContent = "此页面不可下载";
    setTimeout(ping, 1800);
    return;
  }
  chrome.runtime.sendMessage({ type: "add", payload: { url: tab.url } }, r => {
    const ok = r && r.ok;
    $('#st').textContent = ok ? "已加入" : "失败";
    if (!ok && r && r.error) $('#hint').textContent = r.error;
    setTimeout(ping, 1500);
  });
};
load();
</script>
</body>
</html>
